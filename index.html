<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Chat</title>
<meta name="theme-color" content="#5b6cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Chat">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f8; --panel:#ffffff; --panel2:#f0f1f6; --text:#14151a; --muted:#6b6f7e; --line:#e4e6ee;
  --accent:#5b6cff; --accent2:#a35bff; --theirs:#eceef4; --danger:#e5484d; --shadow:0 8px 30px rgba(20,21,40,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f14; --panel:#16181f; --panel2:#1f222b; --text:#f2f3f7; --muted:#9a9eb0; --line:#272a35;
    --theirs:#262a35; --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f14; --panel:#16181f; --panel2:#1f222b; --text:#f2f3f7; --muted:#9a9eb0; --line:#272a35;
  --theirs:#262a35; --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;font-size:17px;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  padding-top:max(24px,env(safe-area-inset-top));text-align:center;gap:18px;overflow:auto}
.logo{width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:46px;box-shadow:var(--shadow)}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0;max-width:340px;line-height:1.4}
.code-input{width:100%;max-width:340px;padding:16px 18px;font-size:20px;border-radius:16px;border:2px solid var(--line);background:var(--panel);color:var(--text);text-align:center;outline:none}
.code-input:focus{border-color:var(--accent)}
.big-btn{width:100%;max-width:340px;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:18px}
.big-btn:disabled{opacity:.5}
.err{color:var(--danger);min-height:1.2em;margin:0}
.who-grid{display:grid;grid-template-columns:repeat(2,minmax(120px,170px));gap:16px}
.who{background:var(--panel);border-radius:24px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow);border:3px solid transparent;transition:transform .12s}
.who:active{transform:scale(.96)}
.who .av{width:84px;height:84px;font-size:46px}
.who b{font-size:20px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;color:#fff;line-height:1}

/* App layout */
#app{position:absolute;inset:0;display:grid;grid-template-columns:340px 1fr}
.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top))}
.list-head h2{margin:0;font-size:28px;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:20px;flex:none}
.chats{overflow-y:auto;flex:1;padding:4px 8px 20px}
.chat-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;text-align:left}
.chat-item:hover{background:var(--panel2)}
.chat-item.active{background:var(--panel2)}
.chat-item .av{width:56px;height:56px;font-size:30px}
.ci-main{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:8px}
.ci-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{color:var(--muted);font-size:13px;flex:none}
.ci-prev{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-item.unread .ci-name,.chat-item.unread .ci-prev{color:var(--text);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
.group-av{background:linear-gradient(135deg,#ffb347,#ff6f91)}
.banner{margin:6px 12px 8px;padding:12px 14px;border-radius:14px;background:var(--panel2);font-size:14px;display:flex;gap:10px;align-items:center;text-align:left}
.banner button{background:var(--accent);color:#fff;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;flex:none}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.chat-head .av{width:40px;height:40px;font-size:22px}
.ch-name{font-weight:700}
.ch-sub{font-size:13px;color:var(--muted)}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.empty-chat{margin:auto;color:var(--muted);text-align:center;padding:30px}
.day{align-self:center;color:var(--muted);font-size:12px;font-weight:600;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:8px;max-width:100%}
.row.cont{margin-top:2px}
.row.mine{flex-direction:row-reverse}
.row .av{width:30px;height:30px;font-size:16px}
.row.cont .av{visibility:hidden}
.row.mine .av{display:none}
.stack{display:flex;flex-direction:column;max-width:min(75%,520px);align-items:flex-start}
.row.mine .stack{align-items:flex-end}
.who-label{font-size:12px;color:var(--muted);margin:0 0 3px 12px}
.bubble{padding:9px 14px;border-radius:20px;background:var(--theirs);line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.row.mine .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bubble.big{background:none!important;font-size:46px;padding:0 4px;line-height:1.1}
.bubble.media{padding:3px;background:var(--theirs)}
.row.mine .bubble.media{background:var(--accent)}
.bubble img{display:block;max-width:min(280px,62vw);max-height:360px;border-radius:17px;min-width:120px;min-height:90px;background:var(--panel2);object-fit:cover}
.bubble.pending{opacity:.6}
.bubble.failed{outline:2px solid var(--danger)}
.voice{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;min-width:190px}
.vplay{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:16px;flex:none}
.row:not(.mine) .vplay{background:var(--accent);color:#fff}
.vbar{flex:1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:currentColor}
.vtime{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.time{font-size:11px;color:var(--muted);margin:3px 8px 0}
.reacts{display:flex;gap:3px;margin-top:-6px;z-index:1;flex-wrap:wrap}
.reacts:empty{display:none}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1px 6px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip.me{border-color:var(--accent)}
.seen{align-self:flex-end;font-size:12px;color:var(--muted);margin:4px 4px 0}
.typing{font-size:13px;color:var(--muted);padding:0 16px 4px;min-height:18px}

.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.composer .icon-btn{background:none;color:var(--accent);font-size:24px;width:42px;height:42px}
.input-wrap{flex:1;display:flex;align-items:flex-end;background:var(--panel2);border-radius:22px;padding:2px 4px 2px 14px;min-width:0}
textarea{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;resize:none;padding:9px 0;max-height:130px;line-height:1.3;min-width:0}
.send{background:linear-gradient(135deg,var(--accent),var(--accent2))!important;color:#fff!important;font-size:18px!important}
.rec-bar{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:22px;padding:0 14px;height:42px}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.no-chat{margin:auto;color:var(--muted);text-align:center}
.no-chat .logo{margin:0 auto 14px}

/* Sheets */
.overlay{position:fixed;inset:0;background:rgba(10,10,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:80vh;overflow:auto}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px}}
.react-row{display:flex;justify-content:space-around;font-size:34px;padding:4px 0 12px}
.react-row button{padding:4px;border-radius:12px;transition:transform .1s}
.react-row button:active{transform:scale(1.3)}
.sheet-btn{display:block;width:100%;text-align:left;padding:14px 12px;border-radius:12px;font-size:17px}
.sheet-btn:hover{background:var(--panel2)}
.sheet-btn.danger{color:var(--danger)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;font-size:28px}
.emoji-grid button{padding:6px 0;border-radius:10px}
.emoji-grid button:hover{background:var(--panel2)}
.sheet h3{margin:0 0 12px;font-size:20px}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;color:#fff;font-size:30px;width:48px;height:48px;background:rgba(255,255,255,.15);border-radius:50%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:70;max-width:90vw;text-align:center}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #app.in-chat .list{display:none}
  #app:not(.in-chat) .chat{display:none}
  .back{display:grid}
}
</style>
</head>
<body>

<!-- Unlock -->
<div id="unlock" class="screen hidden">
  <img class="logo" src="icon-192.png" alt="">
  <h1>Family Chat</h1>
  <p class="sub">Just for our family. Type the family code to unlock this device.</p>
  <input id="code" class="code-input" placeholder="Family code" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="unlockBtn" class="big-btn">Unlock</button>
  <p id="unlockErr" class="err"></p>
</div>

<!-- Who are you -->
<div id="whoami" class="screen hidden">
  <h1>Who are you?</h1>
  <p class="sub">Tap your picture.</p>
  <div id="whoGrid" class="who-grid"></div>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <aside class="list">
    <div class="list-head">
      <h2>Chats</h2>
      <button class="icon-btn" id="meBtn" title="Settings">⚙️</button>
    </div>
    <div id="notifBanner" class="banner hidden"></div>
    <div id="chatList" class="chats"></div>
  </aside>
  <main class="chat" id="chatPane">
    <div class="no-chat" id="noChat"><img class="logo" src="icon-192.png" alt="">Pick a chat to start</div>
    <div id="chatInner" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="chat-head">
        <button class="icon-btn back" id="backBtn">‹</button>
        <div id="chAv" class="av"></div>
        <div style="min-width:0"><div class="ch-name" id="chName"></div><div class="ch-sub" id="chSub"></div></div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="typing" id="typing"></div>
      <div class="composer" id="composer">
        <button class="icon-btn" id="photoBtn" title="Photo">📷</button>
        <input type="file" id="photoInput" accept="image/*" class="hidden">
        <div class="input-wrap" id="inputWrap">
          <textarea id="text" rows="1" placeholder="Message"></textarea>
          <button class="icon-btn" id="emojiBtn" title="Emoji" style="width:36px;height:38px;font-size:22px">😊</button>
        </div>
        <div class="rec-bar hidden" id="recBar"><div class="rec-dot"></div><span id="recTime">0:00</span><span style="color:var(--muted);font-size:14px">Recording…</span>
          <button id="recCancel" style="margin-left:auto;color:var(--danger);font-weight:600">Cancel</button></div>
        <button class="icon-btn" id="micBtn" title="Voice message">🎤</button>
        <button class="icon-btn send hidden" id="sendBtn" title="Send">➤</button>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const SB_URL = 'https://xxdobfuehldoieciyvkg.supabase.co';
const SB_KEY = 'sb_publishable_SZe-yJ5UR5cyGiQ4XkRsHw_KRIX1Kpx';
const FAMILY_EMAIL = 'family@ricefamily.chat';
const VAPID_PUBLIC = 'BIrG9CDT05-ECv5WMpw2xelony2RTn50_vhjc2fGgLmWNgtztQ0wqlEvH-Ik7jJZ8Efo9jfRmmWsfOAJsOMs9Fk';
const REACTIONS = ['❤️','😂','👍','😮','😢','🎉'];
const EMOJIS = '😀😁😂🤣😊😍🥰😘😎🤩🥳😜🤪😇🙂😉🤗🤔😴😢😭😡😱🤯👍👎👏🙌🙏💪👋✌️🤞❤️🧡💛💚💙💜🖤💖🔥⭐🌈☀️🌙⚡🎉🎂🎁🍕🍔🍟🍦🍩🍪🍎🍓⚽🏀🎮🎨📚🚗✈️🐶🐱🐰🦄🦖🐢🐬🦋🌸'.match(/\p{Extended_Pictographic}️?/gu);

const sb = createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'fc-auth' } });
const $ = id => document.getElementById(id);
const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

const S = { members: [], byId: {}, me: null, msgs: {}, reacts: {}, reads: {}, chat: null, urls: {}, oldestLoaded: {}, typing: {} };

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmId = (a,b) => 'dm:' + [a,b].sort().join(':');
const chatMembers = c => c === 'family' ? S.members.map(m=>m.id) : c.slice(3).split(':');
const otherIn = c => chatMembers(c).find(id => id !== S.me);
function toast(t, ms=2600){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), ms); }
function avHtml(m, cls='av'){ return `<div class="${cls}" style="background:${esc(m?.color||'#888')}">${esc(m?.avatar||'🙂')}</div>`; }
function fmtTime(d){ d=new Date(d); return d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}); }
function fmtListTime(d){ d=new Date(d); const now=new Date(); if (d.toDateString()===now.toDateString()) return fmtTime(d);
  const diff=(now-d)/864e5; if (diff<6) return d.toLocaleDateString('en-AU',{weekday:'short'}); return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}); }
function fmtDay(d){ d=new Date(d); const now=new Date(); const y=new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString()===now.toDateString()) return 'Today'; if (d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'}); }
const isBigEmoji = t => t && t.length <= 12 && /^(\p{Extended_Pictographic}|️|‍|\p{Emoji_Modifier}|\s)+$/u.test(t);
const preview = m => !m ? 'Say hi 👋' : m.kind==='image' ? '📷 Photo' : m.kind==='voice' ? '🎤 Voice message' : m.body;
function normCode(c){ return c.trim().split(/[\s\-_.]+/).filter(Boolean).map(w => /^[a-z]/i.test(w) ? w[0].toUpperCase()+w.slice(1).toLowerCase() : w).join('-'); }
const safePath = c => c.replace(/:/g,'_');
async function mediaUrl(path){
  if (S.urls[path]) return S.urls[path];
  const { data, error } = await sb.storage.from('media').createSignedUrl(path, 60*60*6);
  if (error) throw error; S.urls[path] = data.signedUrl; return data.signedUrl;
}
function show(id){ for (const s of ['unlock','whoami','app']) $(s).classList.toggle('hidden', s!==id); }

// ---------- boot ----------
async function boot(){
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show('unlock');
  await afterAuth();
}
$('unlockBtn').onclick = unlock;
$('code').onkeydown = e => { if (e.key==='Enter') unlock(); };
async function unlock(){
  const code = normCode($('code').value); if (!code) return;
  $('unlockBtn').disabled = true; $('unlockErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: FAMILY_EMAIL, password: code });
  $('unlockBtn').disabled = false;
  if (error) { $('unlockErr').textContent = /rate|many/i.test(error.message) ? 'Too many tries. Wait a few minutes.' : 'That code isn’t right. Try again.'; return; }
  await afterAuth();
}
async function afterAuth(){
  const { data, error } = await sb.from('members').select('*').order('sort');
  if (error || !data?.length) { toast('Couldn’t load the family. Check your internet.'); return show('unlock'); }
  S.members = data; S.byId = Object.fromEntries(data.map(m=>[m.id,m]));
  const me = ls.get('fc-me');
  if (me && S.byId[me]) { S.me = me; return startApp(); }
  showWho();
}
function showWho(){
  $('whoGrid').innerHTML = S.members.map(m => `<button class="who" data-id="${m.id}">${avHtml(m)}<b>${esc(m.name)}</b></button>`).join('');
  $('whoGrid').querySelectorAll('.who').forEach(b => b.onclick = () => { S.me = b.dataset.id; ls.set('fc-me', S.me); startApp(); });
  show('whoami');
}

// ---------- data ----------
let started = false;
async function startApp(){
  show('app');
  const [m, r, rd] = await Promise.all([
    sb.from('messages').select('*').order('created_at',{ascending:false}).limit(800),
    sb.from('reactions').select('*').limit(5000),
    sb.from('last_read').select('*'),
  ]);
  S.msgs = {}; S.reacts = {}; S.reads = {};
  for (const x of (m.data||[]).reverse()) (S.msgs[x.chat] ||= []).push(x);
  for (const x of (r.data||[])) (S.reacts[x.message_id] ||= []).push(x);
  for (const x of (rd.data||[])) (S.reads[x.member_id] ||= {})[x.chat] = x.read_at;
  renderList(); updateNotifBanner(); syncPushOwner();
  if (!started) { started = true; subscribe(); }
  const want = new URLSearchParams(location.search).get('chat');
  if (want && myChats().includes(want)) openChat(want);
  else if (S.chat) openChat(S.chat);
  else if (matchMedia('(min-width:761px)').matches) openChat('family');
}
const myChats = () => ['family', ...S.members.filter(m=>m.id!==S.me).map(m=>dmId(S.me,m.id))];
const lastMsg = c => { const a=S.msgs[c]; return a?.[a.length-1]; };
function unreadCount(c){
  const since = S.reads[S.me]?.[c] || '1970'; return (S.msgs[c]||[]).filter(m => m.member_id!==S.me && m.created_at > since).length;
}

// ---------- realtime ----------
let typingCh;
function subscribe(){
  sb.channel('db')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'}, p => onNewMsg(p.new))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'}, p => onDelMsg(p.old.id))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'reactions'}, p => onReact(p.new, true))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'reactions'}, p => onReact(p.old, false))
    .on('postgres_changes',{event:'*',schema:'public',table:'last_read'}, p => { const x=p.new; if (!x?.member_id) return; (S.reads[x.member_id] ||= {})[x.chat]=x.read_at; renderList(); if (S.chat===x.chat) updateSeen(); })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'members'}, ()=>afterAuth())

  const f=e.target.files[0]; e.target.value=''; if (!f || !S.chat) return;
  const chat=S.chat;
  try {
    const blob = await shrink(f);
    const id=crypto.randomUUID(), path=`${safePath(chat)}/${id}.jpg`;
    S.urls[path]=URL.createObjectURL(blob);
    const local={ id, chat, member_id:S.me, kind:'image', media_path:path, created_at:new Date().toISOString(), _pending:true };
    onNewMsg(local);
    const { error } = await sb.storage.from('media').upload(path, blob, { contentType:'image/jpeg' });
    if (error) { local._pending=false; local._failed=true; onNewMsg(local); throw error; }
    await insertMsg({ id, chat, member_id:S.me, kind:'image', media_path:path });
  } catch (err) { console.error(err); toast('Photo didn’t send. Try again.'); }
};
function shrink(file){
  return new Promise((res, rej) => {
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload = () => { const max=1600; let {width:w,height:h}=img; const k=Math.min(1, max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('encode')); }, 'image/jpeg', .85); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image')); }; img.src=url;
  });
}

// voice
let rec=null, recChunks=[], recStart=0, recTimer=null, recCancelled=false, recStream=null;
$('micBtn').onclick = async () => {
  if (rec) return stopRec();
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Voice messages aren’t supported on this device.');
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio:true }); } catch { return toast('Allow the microphone to send voice messages.'); }
  const type = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t => MediaRecorder.isTypeSupported?.(t)) || '';
  rec = new MediaRecorder(recStream, type ? { mimeType:type } : undefined); recChunks=[]; recCancelled=false;
  rec.ondataavailable = e => e.data.size && recChunks.push(e.data);
  rec.onstop = onRecStop; rec.start(); recStart=Date.now();
  $('inputWrap').classList.add('hidden'); $('photoBtn').classList.add('hidden'); $('recBar').classList.remove('hidden');
  $('micBtn').textContent='➤'; $('micBtn').classList.add('send');
  recTimer=setInterval(() => { const s=(Date.now()-recStart)/1000; $('recTime').textContent=fmtDur(s); if (s>=120) stopRec(); }, 250);
};
$('recCancel').onclick = () => { recCancelled=true; stopRec(); };
function stopRec(){ clearInterval(recTimer); try { rec?.stop(); } catch {} recStream?.getTracks().forEach(t=>t.stop()); }
async function onRecStop(){
  const dur=(Date.now()-recStart)/1000, mime=rec.mimeType||'audio/mp4'; rec=null;
  $('inputWrap').classList.remove('hidden'); $('photoBtn').classList.remove('hidden'); $('recBar').classList.add('hidden');
  $('micBtn').textContent='🎤'; $('micBtn').classList.remove('send');
  if (recCancelled || dur<0.7 || !S.chat) return;
  const blob=new Blob(recChunks,{ type:mime }); const ext=mime.includes('webm')?'webm':'m4a';
  const chat=S.chat, id=crypto.randomUUID(), path=`${safePath(chat)}/${id}.${ext}`;
  S.urls[path]=URL.createObjectURL(blob);
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType: mime.split(';')[0] });
  if (error) return toast('Voice message didn’t send. Try again.');
  insertMsg({ id, chat, member_id:S.me, kind:'voice', media_path:path, duration_sec:Math.round(dur*10)/10 });
}

function installHelp(){
  sheet(isIOS
    ? `<h3>Add to Home Screen</h3><p class="sub" style="max-width:none;text-align:left">1. Tap the <b>Share</b> button (square with an arrow) at the top or bottom of Safari.<br><br>2. Tap <b>Add to Home Screen</b>.<br><br>3. Open <b>Family Chat</b> from the home screen. Then you can turn on notifications.</p>`
    : `<h3>Install the app</h3><p class="sub" style="max-width:none;text-align:left">In Chrome or Edge, click the install icon in the address bar (or the ⋮ menu → <b>Install Family Chat</b>). On Android: ⋮ menu → <b>Add to Home screen</b>.</p>`);
}
function updateNotifBanner(){
  const b=$('notifBanner'); const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  if (ls.get('fc-banner-off')==='1' || perm==='granted') return b.classList.add('hidden');
  if (isIOS && !isStandalone()) { b.innerHTML = `<span>📲 Add this to your Home Screen to get message alerts.</span><button>How</button>`; b.querySelector('button').onclick=installHelp; }
  else if (perm==='unsupported' || perm==='denied') return b.classList.add('hidden');
  else { b.innerHTML = `<span>🔔 Get a ping when someone messages.</span><button>Turn on</button>`; b.querySelector('button').onclick=enableNotifs; }
  b.classList.remove('hidden');
}
function b64ToBytes(s){ const p='='.repeat((4-s.length%4)%4); const raw=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(raw, c=>c.charCodeAt(0)); }
async function enableNotifs(){
  if (isIOS && !isStandalone()) return installHelp();
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return toast('This device can’t do notifications.');
  const p = await Notification.requestPermission();
  if (p!=='granted') return toast('Notifications are off. You can turn them on in Settings.');
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC) });
    const { error } = await sb.from('push_subscriptions').upsert({ endpoint:sub.endpoint, member_id:S.me, subscription:sub.toJSON() });
    if (error) throw error;
    toast('Notifications are on 🔔'); updateNotifBanner();
  } catch (e) { console.error(e); toast('Couldn’t turn on notifications.'); }
}
async function syncPushOwner(){
  try { if (!('serviceWorker' in navigator) || Notification.permission!=='granted') return;
    const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if (!sub) return;
    await sb.from('push_subscriptions').upsert({ endpoint:sub.endpoint, member_id:S.me, subscription:sub.toJSON() });
  } catch {}
}
navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.chat && myChats().includes(e.data.chat)) openChat(e.data.chat); });

boot();
</script>
